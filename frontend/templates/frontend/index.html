{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автосервіс - Управління</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Login Section -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
            <h2 class="text-3xl font-bold text-gray-900 mb-6 text-center">🚗 Автосервіс</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
                <button onclick="window.authManager.login()" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                    Login
                </button>
                <div id="loginError" class="text-red-600 text-sm text-center hidden"></div>
            </div>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="appSection" class="hidden p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-3 rounded-xl">
                            <span class="text-white text-2xl">🚗</span>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold text-gray-900">Автосервіс</h1>
                            <p class="text-gray-500">Управління обслуговуванням</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="userInfo" class="text-gray-700 font-medium"></span>
                        <button onclick="window.authManager.logout()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
                            Вийти
                        </button>
                    </div>
                </div>
            </div>

            <!-- Cars Section -->
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Мої автомобілі</h2>
                    <button onclick="window.carManager.showAddCarModal()" class="flex items-center gap-2 bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg">
                        ➕ Додати авто
                    </button>
                </div>
                <div id="carsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cars will be loaded here -->
                </div>
            </div>

            <!-- Services Section -->
            <div id="servicesSection" class="bg-white rounded-2xl shadow-xl p-6 hidden">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">Обслуговування</h2>
                        <p id="selectedCarInfo" class="text-gray-600 mt-1"></p>
                    </div>
                    <button onclick="window.serviceManager.showAddServiceModal()" class="flex items-center gap-2 bg-green-600 text-white px-6 py-3 rounded-xl hover:bg-green-700 transition-colors shadow-lg">
                        🔧 Додати роботу
                    </button>
                </div>
                <div id="servicesList" class="space-y-3">
                    <!-- Services will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Car Modal -->
    <div id="addCarModal" class="modal">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md m-4">
            <h3 class="text-2xl font-bold text-gray-900 mb-6">Додати автомобіль</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Бренд</label>
                    <select id="carBrand" 
                    onchange="window.carManager.loadModels(this.value); return false;" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">Оберіть бренд</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Модель</label>
                    <select id="carModel" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">Спочатку оберіть бренд</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Початковий пробіг (км)</label>
                    <input type="number" id="initialMileage" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Поточний пробіг (км)</label>
                    <input type="number" id="currentMileage" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="window.carManager.addCar()" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                    Додати
                </button>
                <button onclick="window.carManager.closeModal('addCarModal')" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-400 transition-colors font-medium">
                    Скасувати
                </button>
            </div>
        </div>
    </div>

    <!-- Add Service Modal -->
    <div id="addServiceModal" class="modal">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md m-4">
            <h3 class="text-2xl font-bold text-gray-900 mb-6">Додати роботу</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Опис роботи</label>
                    <input type="text" id="workDescription" placeholder="Заміна масла, фільтрів..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Години роботи</label>
                    <input type="number" step="0.5" id="workHours" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Дата</label>
                    <input type="date" id="scheduledDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="window.serviceManager.addService()" class="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-medium">
                    Додати
                </button>
                <button onclick="window.serviceManager.closeModal('addServiceModal')" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-400 transition-colors font-medium">
                    Скасувати
                </button>
            </div>
        </div>
    </div>

    <script type="module"  src="{% static 'main.js' %}">
    </script>
</body>
</html>
